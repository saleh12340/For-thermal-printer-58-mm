name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Prepare Build Environment (Keystore & SDK Licenses)
      run: |
        # 1. Create .env file for Secrets Gradle Plugin
        touch .env

        # 2. Restore debug.keystore from base64 or generate if missing
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        else
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        # 3. Accept Android SDK licenses
        mkdir -p "$ANDROID_HOME/licenses" || true
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo "84831b9409646a297e0903823485cc9988b0a50e" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

        # 4. Make gradlew executable
        chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk MiniPrintPro.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: MiniPrintPro.apk

    - name: Publish Direct APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && success()
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "MiniPrint Pro v1.0.${{ github.run_number }} (Direct APK)"
        body: "يمكنك تحميل ملف `MiniPrintPro.apk` مباشرة وتثبيته على هاتفك الأندرويد دون الحاجة لفك أي ضغط."
        files: MiniPrintPro.apk
        draft: false
        prerelease: false
        generate_release_notes: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
